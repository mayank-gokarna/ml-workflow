apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taxi-fare-predictor
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: local-mlops-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mayank-gokarna/ml-workflow.git
    targetRevision: main
    path: local-mlops-platform
    # Deploy exactly these manifests (avoids duplicating them into a separate
    # overlay). secret.yaml.example and *-sklearn.yaml are intentionally excluded.
    directory:
      recurse: true
      include: '{kubernetes/namespace.yaml,kubernetes/configmap.yaml,kserve/inference-service.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
  # KServe's controller defaults/mutates the InferenceService after apply; ignore
  # fields it manages so the app doesn't flap OutOfSync on controller-owned data.
  ignoreDifferences:
    - group: serving.kserve.io
      kind: InferenceService
      managedFieldsManagers:
        - kserve-controller-manager
        - manager
