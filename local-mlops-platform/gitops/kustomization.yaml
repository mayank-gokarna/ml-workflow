apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# GitOps bundle that Argo CD syncs. Aggregates the base namespace/config and the
# KServe InferenceService so a single Argo CD Application manages the deployment.
resources:
  - ../kubernetes/namespace.yaml
  - ../kubernetes/configmap.yaml
  - ../kserve/inference-service.yaml
