[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-demo"
version = "0.1.0"
description = "Local NYC Taxi fare/time prediction MLOps demo"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.14,<3"]
data = ["pyarrow>=15"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]

[project.scripts]
mlops-train = "mlops_demo.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require external services (MLflow, KServe)",
    "e2e: end-to-end tests against a deployed endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
